# The reader, on http://localhost:8080.
#
#   docker compose up --build
#
# Two containers: the site (nginx and its files) and the MCP server, which the
# site's nginx reaches at /mcp. The site runs on its own just as well.
#
# SITE is baked into the pages at build time, not read at runtime, because
# every page names it. Change it and rebuild.

services:
  quran:
    build:
      context: .
      args:
        SITE: ${SITE:-http://localhost:8080}
        # A host of your own (https://audio.example.com), or /audio when a
        # reciter is in the image — see .dockerignore and DOCKER.md.
        AUDIO: ${AUDIO:-}
    ports:
      - "8080:80"
    restart: unless-stopped

  # The public MCP server (/mcp, passed on by the site's nginx). Its own
  # container: Node beside nginx's files, restarted and limited on its own,
  # and reached only through the site, so it publishes no port.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      MCP_PER_MINUTE: ${MCP_PER_MINUTE:-60}
      # No feedback service in this image, so no send_feedback
      MCP_FEEDBACK_URL: ""
    read_only: true
    mem_limit: 192m
    restart: unless-stopped
