<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Read Quran Today · Ayah</title>
<style>
  /* The mushaf's own face, for the Arabic when the glyphs do not come */
  @font-face { font-family: "Hafs"; src: url(data:font/woff2;base64,@@FONT@@) format("woff2"); font-display: block; }

  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f4f7fa);
    --text: var(--color-text-primary, #16283a);
    --mute: var(--color-text-secondary, #5a7589);
    --line: var(--color-border-tertiary, #dce8f2);
    --accent: #1a6fa3;
    --accent-soft: rgba(26, 111, 163, 0.12);
    --radius: var(--border-radius-lg, 12px);
    --ui: var(--font-sans, system-ui, "Segoe UI", Tahoma, sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1a1f25); --bg2: var(--color-background-secondary, #20262d);
      --text: var(--color-text-primary, #d7dce1); --mute: var(--color-text-secondary, #8b939c);
      --line: var(--color-border-tertiary, #2d353e); --accent: #3f9bd1; --accent-soft: rgba(63, 155, 209, 0.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1a1f25); --bg2: var(--color-background-secondary, #20262d);
    --text: var(--color-text-primary, #d7dce1); --mute: var(--color-text-secondary, #8b939c);
    --line: var(--color-border-tertiary, #2d353e); --accent: #3f9bd1; --accent-soft: rgba(63, 155, 209, 0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font-family: var(--ui); }
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; min-width: 0; }

  .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  .title { flex: 1; min-width: 0; }
  .surah { font-family: "Hafs", serif; font-size: 1.35rem; line-height: 1.3; color: var(--accent); }
  .sub { font-size: 0.78rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .body { max-height: 620px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
  /* The mushaf's own lines: one row each, never wrapped, flush to both margins as the page prints them */
  .page { padding: 16px 16px 12px; direction: rtl; overflow: hidden; }
  .page.wait-fonts .ln { visibility: hidden; }
  .ln { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; line-height: 1.85; }
  .ln.short { justify-content: center; gap: 0.25em; }
  .page.measure .ln { width: max-content; justify-content: flex-start; gap: 0.25em; }
  .w { flex: 0 0 auto; transition: color 0.2s, opacity 0.2s; }
  .w.other { opacity: 0.3; }
  .w.on { color: var(--accent); }
  .plain { padding: 14px 16px; font-family: "Hafs", serif; font-size: 1.6rem; line-height: 2.2; text-align: center; }
  .trs { border-top: 1px solid var(--line); }
  .tr { display: flex; gap: 10px; padding: 10px 16px; font-size: 0.95rem; line-height: 1.65; border-bottom: 1px solid var(--line); transition: background 0.2s; }
  .tr:last-child { border-bottom: 0; }
  .tr.on { background: var(--accent-soft); }
  .tr .n { flex: none; min-width: 1.9em; height: 1.9em; margin-top: 0.1em; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; color: var(--accent); border: 1.5px solid currentColor; direction: ltr; }
  .tr .t { flex: 1; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); background: var(--bg2); }
  button { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 999px; height: 34px; padding: 0 14px 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.84rem; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }
  button svg { width: 16px; height: 16px; fill: currentColor; }
  .src { flex: 1; min-width: 0; font-size: 0.74rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
  .note { padding: 10px 14px; font-size: 0.82rem; color: var(--color-text-danger, #b3261e); border-top: 1px solid var(--line); }
  .note[hidden], .wait[hidden] { display: none; }
  .wait { padding: 24px 16px; text-align: center; color: var(--mute); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="title">
      <div class="surah" id="surah">&nbsp;</div>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
  </div>
  <div class="wait" id="wait">…</div>
  <div class="body" id="body" hidden></div>
  <div class="note" id="note" role="alert" hidden></div>
  <div class="bar">
    <button id="play" disabled><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg><span id="playText">استمع</span></button>
    <span class="src" id="src">&nbsp;</span>
    <a id="open">readqurantoday.com</a>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script>/*@@CLIENT@@*/</script>
<script>
(function () {
  'use strict';
  var A = window.McpApps;
  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');
  var app = new A.App({ name: 'Read Quran Today ayah', version: '1.0.0' });

  var data = null;          // get_ayah's answer
  var rec = null;           // the run's recording, fetched on the first listen
  var ar = true;
  var PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  var say = function (a, e) { return ar ? a : e; };
  var digits = function (n) { return ar ? String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }) : String(n); };

  function theme(ctx) {
    if (!ctx) return;
    if (ctx.theme) { A.applyDocumentTheme(ctx.theme); document.documentElement.setAttribute('data-theme', ctx.theme); }
    if (ctx.styles && ctx.styles.variables) A.applyHostStyleVariables(ctx.styles.variables);
    if (ctx.styles && ctx.styles.css && ctx.styles.css.fonts) A.applyHostFonts(ctx.styles.css.fonts);
    if (ctx.locale) ar = /^ar\b/i.test(ctx.locale);
    labels();
  }
  function labels() {
    $('playText').textContent = audio.paused ? say('استمع', 'Listen') : say('إيقاف', 'Pause');
    $('open').textContent = say('اقرأ في المصحف', 'Read in the mushaf');
  }
  function note(msg) { $('note').textContent = msg || ''; $('note').hidden = !msg; }

  /* Each mushaf page is a font of its own (QCF V2), fetched from the site; the lines are set once all have come */
  var fontBase = '', lines = null;
  function loadFaces(pages) {
    return Promise.all(pages.map(function (p) {
      return new FontFace('qcf' + p, 'url(' + fontBase + 'p' + p + '.woff2)').load().then(function (f) { document.fonts.add(f); });
    }));
  }

  /* The widest line fills the card, as the page fills its measure; one much shorter is centred, as the site does */
  function fit() {
    var page = document.querySelector('.page');
    if (!page) return;
    var avail = page.clientWidth - 32;
    page.style.fontSize = '20px';
    page.classList.add('measure');
    var rows = page.querySelectorAll('.ln'), widths = [], widest = 1;
    rows.forEach(function (el) { var w = el.scrollWidth; widths.push(w); if (w > widest) widest = w; });
    page.classList.remove('measure');
    page.style.fontSize = Math.min(38, 20 * avail / widest) + 'px';
    rows.forEach(function (el, i) { el.classList.toggle('short', widths[i] < widest * 0.8); });
  }
  if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(document.body);

  /* The Unicode text in the embedded face, where the page fonts cannot come */
  var HAFS = { 'ْ': 'ۡ', '۟': 'ْ', '۫': '۬', 'ۣ': 'ۜ' };
  function plain(box) {
    box.className = 'plain';
    box.textContent = data.ayahs.map(function (x, i) {
      return x.arabic.replace(/[ْۣ۟۫]/g, function (c) { return HAFS[c]; }) + ' ۝' + digits(first() + i);
    }).join(' ');
  }
  var first = function () { return Number(data.ayahs[0].ref.split(':')[1]); };

  function show(result) {
    if (!result || result.isError) { note((result && result.content && result.content[0] && result.content[0].text) || say('تعذّر جلب الآية.', 'The ayah could not be loaded.')); return; }
    data = result.structuredContent || JSON.parse(result.content[0].text);
    var m = result._meta && result._meta['com.readqurantoday/mushaf'];
    lines = m && Array.isArray(m.lines) && m.lines.length ? m.lines : null;
    note('');
    var n = data.ayahs.length, a0 = first(), aN = a0 + n - 1;
    $('surah').textContent = data.surah.arabic ? 'سورة ' + data.surah.arabic : data.surah.name;
    $('sub').textContent = data.surah.name + ' · ' + data.surah.number + ':' + a0 + (n > 1 ? '–' + aN : '') + ' · ' + say('صفحة ', 'page ') + digits(data.ayahs[0].page);
    $('src').textContent = data.translation || '';
    var body = $('body');
    body.textContent = '';
    var page = document.createElement('div');
    body.appendChild(page);
    if (lines) {
      fontBase = m.fonts;
      page.className = 'page wait-fonts';
      var pages = [];
      lines.forEach(function (line) {
        if (pages.indexOf(line.page) < 0) pages.push(line.page);
        var row = document.createElement('div');
        row.className = 'ln';
        row.style.fontFamily = 'qcf' + line.page;
        line.words.forEach(function (w) {
          var el = document.createElement('span');
          el.className = 'w' + (w[1] >= a0 && w[1] <= aN ? '' : ' other');
          el.dataset.a = w[1];
          el.textContent = w[0];
          row.appendChild(el);
        });
        page.appendChild(row);
      });
      loadFaces(pages).then(function () { page.classList.remove('wait-fonts'); fit(); }, function () { plain(page); });
    } else {
      plain(page);
    }
    if (data.ayahs.some(function (x) { return x.translation; })) {
      var trs = document.createElement('div');
      trs.className = 'trs';
      data.ayahs.forEach(function (x, i) {
        if (!x.translation) return;
        var row = document.createElement('div');
        row.className = 'tr';
        row.dataset.a = a0 + i;
        var num = document.createElement('span');
        num.className = 'n';
        num.textContent = digits(a0 + i);
        var t = document.createElement('div');
        t.className = 't';
        t.dir = 'auto';
        t.textContent = x.translation;
        row.appendChild(num);
        row.appendChild(t);
        trs.appendChild(row);
      });
      body.appendChild(trs);
    }
    $('wait').hidden = true;
    body.hidden = false;
    rec = null;
    audio.pause();
    $('play').disabled = false;
    labels();
  }

  /* The run in the site's own recitation, fetched when first asked for, and stopped at its end */
  function mark() {
    if (!rec) return;
    var t = audio.currentTime, a = 0;
    rec.ayahs.forEach(function (x, k) { if (k >= rec.from && k <= rec.to && x.start <= t) a = k + 1; });
    if (audio.paused) a = 0;
    document.querySelectorAll('.w, .tr').forEach(function (el) { el.classList.toggle('on', Number(el.dataset.a) === a); });
  }
  $('play').onclick = function () {
    if (!audio.paused) { audio.pause(); return; }
    if (rec) {
      if (audio.currentTime >= rec.end - 0.3 || audio.currentTime < rec.begin) audio.currentTime = rec.begin;
      audio.play().catch(function () {});
      return;
    }
    var a0 = first(), last = a0 + data.ayahs.length - 1;
    $('play').disabled = true;
    app.callServerTool({ name: 'get_recitation', arguments: { surah: data.surah.number, ayah: a0, to: last } }).then(function (r) {
      var d = r.structuredContent || JSON.parse(r.content[0].text);
      rec = { ayahs: d.ayahs, from: a0 - 1, to: last - 1, begin: d.ayahs[a0 - 1].start, end: d.ayahs[last - 1].end };
      $('src').textContent = (data.translation ? data.translation + ' · ' : '') + (ar ? d.reciter.arabic || d.reciter.name : d.reciter.name);
      audio.src = d.audio;
      audio.onloadedmetadata = function () { audio.currentTime = rec.begin; audio.play().catch(function () {}); audio.onloadedmetadata = null; };
      audio.load();
    }).catch(function () {
      note(say('تعذّر جلب التلاوة.', 'The recitation could not be loaded.'));
    }).then(function () { $('play').disabled = false; });
  };
  audio.onplay = function () { $('playIcon').setAttribute('d', PAUSE); labels(); mark(); };
  audio.onpause = function () { $('playIcon').setAttribute('d', PLAY); labels(); mark(); };
  audio.ontimeupdate = function () {
    if (rec && !audio.paused && audio.currentTime >= rec.end) audio.pause();
    mark();
  };
  audio.onerror = function () {
    if (audio.src) note(say('تعذّر تشغيل الصوت هنا. افتح الآية في المصحف للاستماع.', 'The audio could not play here. Open the ayah in the mushaf to listen.'));
  };
  $('open').onclick = function () {
    var url = data ? data.ayahs[0].read : 'https://readqurantoday.com/';
    app.openLink({ url: url }).catch(function () {});
  };

  app.ontoolinput = function () { $('wait').textContent = say('جارٍ التحميل…', 'Loading…'); };
  app.ontoolresult = show;
  app.onhostcontextchanged = theme;
  app.connect().then(function () { theme(app.getHostContext()); }).catch(function () { note('Not connected to a host.'); });
  labels();
})();
</script>
</body>
</html>
