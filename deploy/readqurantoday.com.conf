# readqurantoday.com — the Madinah Mushaf reader.
#
# The app has no server side: nginx serves public/ straight off disk. There is
# no Node process in production; server.js stays a local dev convenience.
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# See DEPLOY.md. `certbot --nginx` adds the TLS listeners and the http->https
# redirect to this file on first run; everything below survives that edit.

# A script or stylesheet asked for with ?v= is that version and no other:
# the page names a new one when it changes, so it is kept for a year and never
# asked about again. Asked for bare, as the plain-text pages do, it is checked
# every time, as before.
map $arg_v $readquran_asset_cache {
    ""      "public, max-age=0, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name readqurantoday.com www.readqurantoday.com;

    # Only public/ is exposed. tests/, scripts/ and reference/ sit outside the
    # web root and are unreachable by construction, not by rule.
    root /var/www/readqurantoday/public;
    index index.html;

    charset utf-8;

    # ---- one address per page ----
    # Google indexes a page under one URL. Every other way of writing it that
    # answers 200 is crawled, found to name the real one as canonical, and
    # dropped as "Alternative page with proper canonical tag" -- crawl spent on
    # copies instead of the surahs still waiting to be indexed. So the copies
    # redirect: www to the bare domain, and a doubled slash (/surah/3//, from
    # links elsewhere) to the path written once. Matched on the pattern, not the
    # name, so a copy deployed to another domain keeps working.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }
    if ($request_uri ~ "^[^?]*//") {
        return 301 $uri$is_args$args;
    }

    # nginx's own redirects -- /surah/3 to /surah/3/ -- carry a relative
    # address, so they keep the https the reader came in on instead of naming
    # http and adding a hop through the http->https redirect.
    absolute_redirect off;

    # A missing page gets the site's own, with the way back to the mushaf,
    # rather than nginx's bare one. Still a 404, so it is not indexed.
    error_page 404 /404.html;

    # Arabic text and JSON compress hard. woff2 is already compressed, and
    # squeezing it again only burns CPU — note it is absent from gzip_types.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/readquran-security.conf;

    # public/data/.env holds the Quran Foundation credentials. It is gitignored
    # and should never reach the server, but deny dotfiles regardless.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- caching ----
    # Each mushaf page is its own font file and never changes once built, so
    # these are the one thing worth pinning for a year.
    location /fonts/ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
        access_log off;
        try_files $uri =404;
    }

    # The index and the page layout do change when the data is rebuilt, and
    # their names carry no hash, so the browser has to ask. An unchanged file
    # answers 304 with no body, which is cheap.
    location /data/ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control $readquran_asset_cache always;
        try_files $uri =404;
    }

    location ~* \.svg$ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # nginx's stock mime.types has no entry for .webmanifest, so it would go out
    # as application/octet-stream and the browser would ignore it. default_type
    # only fills in when the extension is unknown, which is exactly this case —
    # a types{} block here would replace the whole table instead of adding to it.
    location = /site.webmanifest {
        include /etc/nginx/snippets/readquran-security.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Every html page, not just the root. nginx rewrites a directory request
    # to its index.html internally, so /surah/18/ arrives here as
    # /surah/18/index.html — an exact match on /index.html would cover the
    # front page and silently leave the 114 surah pages with no caching
    # instruction at all, which leaves the browser to guess.
    location ~ /index\.html$ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Analytics, served from this domain rather than a subdomain.
    #
    # Not to hide it — a reader's own devtools shows every request their
    # browser makes, and that is the browser working for them. It is that
    # blockers drop anything called "analytics" on sight, which quietly loses
    # a slice of the readership, and that a same-origin script lets the
    # Content-Security-Policy stay at 'self' with no external host allowed.
    location = /stats.js {
        include /etc/nginx/snippets/readquran-security.conf;
        # Umami sends its own Cache-Control; without hiding it the response
        # carries two, which is ambiguous. Ours is the one that should win.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://127.0.0.1:3000/script.js;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    # Where that script reports to. It derives this from its own origin, so
    # the path has to match what Umami expects.
    location = /api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
