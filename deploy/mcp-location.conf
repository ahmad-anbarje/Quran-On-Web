# The public MCP server: the Quran for AI assistants and developers.
#
# Included once from the readqurantoday.com vhost (a one-time manual edit, since
# certbot owns that file); synced on every deploy like the other snippets.
# Read-only and open to all; the service answers its own CORS preflight.
location = /mcp {
    include /etc/nginx/snippets/cloudflare-realip.conf;

    limit_except POST OPTIONS { deny all; }

    limit_req zone=readquran_mcp burst=20 nodelay;
    limit_req_status 429;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;

    proxy_http_version 1.1;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8788;

    access_log off;
}

# The text files get_file links to (a surah, with a translation or the tafsir),
# made by the same service as they are asked for: GET only, nothing sent in.
location ^~ /mcp/files/ {
    include /etc/nginx/snippets/cloudflare-realip.conf;

    limit_except GET { deny all; }

    limit_req zone=readquran_mcp burst=20 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8788;

    access_log off;
}
