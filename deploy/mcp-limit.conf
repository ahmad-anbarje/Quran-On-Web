# The MCP server's rate limit zone: http-level, so it lives in conf.d.
# Installed by sync-nginx.sh. An assistant answering one question makes a few
# calls in a row, and every reader of one assistant arrives from that company's
# few addresses, so the rate is generous; the service caps everyone together.
limit_req_zone $binary_remote_addr zone=readquran_mcp:1m rate=600r/m;
