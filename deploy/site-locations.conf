# The site's own address rules, as a snippet the vhost includes once
# (include /etc/nginx/snippets/readquran-site.conf), so a push delivers them:
# sync-nginx.sh installs this file, and the vhost itself is never copied.

# The mushaf opened at an ayah, at an address that says so: /surah/2/ayah/255 is surah 2's reader
location ~ ^/surah/\d+/ayah/\d+/?$ {
    rewrite ^/surah/(\d+)/ /surah/$1/index.html last;
}
